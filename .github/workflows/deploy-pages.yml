name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Refresh Gamesheet data
        run: xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" pnpm run update-data || echo "::error title=Gamesheet refresh failed::Deploying with stale fallback data"
        continue-on-error: true
        timeout-minutes: 10
        env:
          GAMESHEET_FETCH_URL_TEMPLATE: ${{ secrets.GAMESHEET_FETCH_URL_TEMPLATE }}
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: pnpm run build
        env:
          VITE_BASE_PATH: ./
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
